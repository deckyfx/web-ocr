[package]
name = "web-ocr-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.7", features = ["desktop"] }
deckyfx-dioxus-ipc-bridge        = "0.2.1"
deckyfx-dioxus-ipc-bridge-macros = "0.2.0"
deckyfx-dioxus-react-integration = "0.2.2"

# Screen capture
xcap  = "0.8.2"
image = "0.25"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Async + serde
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
base64     = "0.22"

# Hotkey + tray (already in Dioxus desktop transitive deps — re-declare for direct use)
global-hotkey = "0.7.0"
tray-icon     = "0.21.3"
tao           = "0.34"

tracing            = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
